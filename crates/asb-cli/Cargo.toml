[package]
name = "asb-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
asb-agents = { version = "=0.1.0", path = "../asb-agents" }
asb-analysis = { version = "=0.1.0", path = "../asb-analysis" }
asb-control = { version = "=0.1.0", path = "../asb-control" }
asb-metrics = { version = "=0.1.0", path = "../asb-metrics" }
asb-protocol = { version = "=0.1.0", path = "../asb-protocol" }
asb-replay = { version = "=0.1.0", path = "../asb-replay" }
asb-runtime = { version = "=0.1.0", path = "../asb-runtime" }
asb-store = { version = "=0.1.0", path = "../asb-store" }
asb-workloads = { version = "=0.1.0", path = "../asb-workloads" }
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
signal-hook = "=0.3.18"
toml = "=0.8.23"
