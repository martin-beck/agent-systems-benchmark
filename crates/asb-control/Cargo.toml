[package]
name = "asb-control"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
rustix = { version = "=1.1.4", features = ["net", "process"] }
schemars = "=1.0.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
thiserror = "=2.0.16"

[dev-dependencies]
jsonschema = { version = "=0.33.0", default-features = false }

[lints]
workspace = true

[[example]]
name = "generate-control-schema"
path = "examples/generate_schema.rs"
