[package]
name = "asb-bundle"
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/martin-beck/agent-systems-benchmark"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"

[lints.clippy]
all = "deny"

[dependencies]
schemars = "=1.0.4"
serde = { version = "=1.0.219", features = ["derive"] }
serde_json = "=1.0.143"
sha2 = "=0.10.9"
thiserror = "=2.0.16"

[dev-dependencies]
tempfile = "=3.22.0"

[[bin]]
name = "asb-bundle-verify"
path = "src/bin/asb_bundle_verify.rs"
