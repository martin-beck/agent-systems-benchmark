name: Native platform evidence
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  qualify:
    name: Native Ubuntu (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Install pinned native sandbox prerequisite
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends bubblewrap=0.9.0-1ubuntu0.1
      - name: Collect classified platform evidence
        id: evidence
        env:
          BASE_COMMIT: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
          CARGO_TARGET_DIR: ${{ runner.temp }}/asb-native-target
          HOSTED_EVIDENCE_FILE: ${{ runner.temp }}/hosted-portability-${{ matrix.runner }}.json
          NATIVE_EVIDENCE_FILE: ${{ runner.temp }}/native-qualification-${{ matrix.runner }}.json
          RUN_ID: gha-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          route="$(python3 tools/platforms/hosted_portability.py route)"
          case "$route" in
            native-qualification)
              python3 tools/platforms/native_evidence.py \
                --platform-id ubuntu-24.04 \
                --architecture "$(uname -m)" \
                --run-id "$RUN_ID" \
                --source "$GITHUB_WORKSPACE" \
                --base-commit "$BASE_COMMIT" \
                --output "$NATIVE_EVIDENCE_FILE" \
                --output-root "$RUNNER_TEMP" \
                --check 'process=["cargo","test","--locked","-p","asb-runtime","--test","process_boundary","--","--test-threads=1"]' \
                --check 'metrics=["cargo","test","--locked","-p","asb-metrics","--test","native_linux","--","--test-threads=1"]' \
                --optional-check 'sandbox=["env","ASB_REQUIRE_NATIVE_SANDBOX=1","cargo","test","--locked","-p","asb-runtime","--test","sandbox_boundary","--","--test-threads=1"]'
              evidence_file="$NATIVE_EVIDENCE_FILE"
              ;;
            hosted-portability)
              python3 tools/platforms/hosted_portability.py collect \
                --runner-label ubuntu-24.04 \
                --architecture "$(uname -m)" \
                --run-id "$RUN_ID" \
                --source "$GITHUB_WORKSPACE" \
                --base-commit "$BASE_COMMIT" \
                --output "$HOSTED_EVIDENCE_FILE" \
                --output-root "$RUNNER_TEMP" \
                --check 'process=["cargo","test","--locked","-p","asb-runtime","--test","process_boundary","--","--test-threads=1"]' \
                --check 'metrics=["cargo","test","--locked","-p","asb-metrics","--test","native_linux","--","--test-threads=1"]' \
                --check 'sandbox=["env","ASB_REQUIRE_NATIVE_SANDBOX=1","cargo","test","--locked","-p","asb-runtime","--test","sandbox_boundary","--","--test-threads=1"]'
              evidence_file="$HOSTED_EVIDENCE_FILE"
              ;;
            *)
              echo "ERROR: platform evidence route is invalid"
              exit 1
              ;;
          esac
          echo "kind=$route" >> "$GITHUB_OUTPUT"
          python3 - "$evidence_file" "$route" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys
          path = pathlib.Path(sys.argv[1])
          route = sys.argv[2]
          report = json.loads(path.read_text(encoding="utf-8"))
          architecture = report.get("architecture", report.get("observed", {}).get("architecture"))
          assert architecture == "x86_64"
          assert report["performance_baseline"] is False
          expected = {
              "hosted-portability": ("hosted-portability", "functional-portability-only"),
              "native-qualification": ("native-run", "native-functional"),
          }[route]
          assert (report["kind"], report["qualification"]) == expected
          print("artifact_sha256=sha256:" + hashlib.sha256(path.read_bytes()).hexdigest())
          print("qualification=" + report["qualification"])
          PY
      - name: Retain rolling-hosted portability evidence
        if: steps.evidence.outputs.kind == 'hosted-portability'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hosted-portability-${{ matrix.runner }}
          path: ${{ runner.temp }}/hosted-portability-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 30
      - name: Retain exact native qualification evidence
        if: steps.evidence.outputs.kind == 'native-qualification'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-qualification-${{ matrix.runner }}
          path: ${{ runner.temp }}/native-qualification-${{ matrix.runner }}.json
          if-no-files-found: error
          retention-days: 30
