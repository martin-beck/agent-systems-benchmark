name: Credential-free benchmark path

"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' || github.ref != 'refs/heads/main' }}
jobs:
  credential-free:
    name: Credential-free benchmark path
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      ASB_CI_CREDENTIAL_FREE: "1"
      ASB_NETWORK_POLICY: deny
      OPENROUTER_API_KEY: ""
      OPENAI_API_KEY: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Assert credential-free environment
        run: |
          test -z "${OPENROUTER_API_KEY}"
          test -z "${OPENAI_API_KEY}"
          test "${ASB_CI_CREDENTIAL_FREE}" = 1
          test "${ASB_NETWORK_POLICY}" = deny
      - name: Exercise complete local benchmark path
        run: |
          cargo test --locked -p asb-cli --lib -- \
            --exact tests::provider_selection_manifest_drives_plan_run_sweep_compare_and_report
          cargo test --locked -p asb-cli --lib -- \
            --exact tests::provider_selection_import_fails_closed_before_run_effects
          cargo test --locked -p asb-cli --lib -- \
            --exact control::tests::strict_replay_consumes_authenticated_cassette_and_rejects_wrong_digest
      - name: Exercise capture, sealing, and hostile replay cases
        run: |
          cargo test --locked -p asb-cli --lib -- \
            --exact tests::record_and_replay_commands_are_explicit_private_and_network_denied
          cargo test --locked -p asb-cli --lib -- \
            --exact control::tests::recording_campaign_lifecycle_transitions_are_durable_and_fail_closed
          cargo test --locked -p asb-cli --lib -- \
            --exact control::tests::strict_replay_requires_a_cassette_path_and_expired_deadline_fails_closed
      - name: Credential-free coverage floor
        run: |
          cargo test --locked -p asb-cli --lib
