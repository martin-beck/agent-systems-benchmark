name: Formal assurance
"on":
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  temporal-recovery:
    name: TLC and Alloy recovery models
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Java runtime
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Check temporal recovery models and deliberate mutations
        run: |
          formal/run_temporal_models.sh \
            "${RUNNER_TEMP}/asb-formal-tools" \
            "${RUNNER_TEMP}/asb-temporal-recovery"
  kani:
    name: Kani bounded proofs
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require the committed dependency graph
        run: cargo metadata --locked --format-version 1 --manifest-path formal/Cargo.toml --no-deps >/dev/null
      - name: Run pinned Kani proofs
        uses: model-checking/kani-github-action@f838096619a707b0f6b2118cf435eaccfa33e51f # v1.1
        with:
          kani-version: "0.67.0"
          command: cargo-kani
          working-directory: formal
          args: --output-format=terse
      - name: Prove Kani rejects a real counterexample
        run: |
          result_file="${RUNNER_TEMP}/kani-negative.log"
          if kani formal/fixtures/kani_false_assertion.rs --output-format=terse >"${result_file}" 2>&1; then
            echo "Kani accepted the deliberate counterexample" >&2
            exit 1
          fi
          grep -q "VERIFICATION:- FAILED" "${result_file}"
          rm -f "${result_file}"
  loom:
    name: Loom and state models (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.93.0 --profile minimal
      - name: Explore Loom and finite state models
        run: cargo test --locked --manifest-path formal/Cargo.toml
