name: Final delivery formal assurance (future)

"on":
  # This lane is intentionally unavailable to ordinary development PRs. A
  # future delivery branch is the sole workflow path that may run TLC/Alloy.
  pull_request:
    branches: [final-delivery]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  temporal-recovery:
    name: Final delivery TLC and Alloy recovery models
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Java runtime
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17.0.20+8"
      - name: Run the sole final-delivery TLC and Alloy gate
        run: |
          formal/run_temporal_models.sh \
            "${RUNNER_TEMP}/asb-formal-tools" \
            "${RUNNER_TEMP}/asb-temporal-recovery"
