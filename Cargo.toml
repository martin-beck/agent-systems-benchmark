[workspace]
members = ["crates/asb-core", "crates/asb-protocol", "crates/asb-replay", "crates/asb-runtime", "crates/asb-store", "crates/asb-analysis", "crates/asb-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
repository = "https://github.com/martin-beck/agent-systems-benchmark"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = "deny"
